# Keywords the weekly discovery job searches for. Edit freely; one keyword per line.
# Each keyword is combined with each year and each query template below.
keywords:
  - FPGA
  - reconfigurable computing
  - VLSI circuits
  - electronic design automation
  - hardware security
  - system-on-chip
  - computer architecture
  - hyperdimensional computing
  - cryogenic electronics
  - low power design
  - test and verification VLSI

years: [2026, 2027]

query_templates:
  - "{keyword} {year} call for papers"
  - "{keyword} conference {year} paper submission deadline"

# Result pages on these hosts are ignored (on top of the built-in aggregator list in the script).
exclude_domains:
  - usenix.org
  - springer.com
  - elsevier.com
  - mdpi.com
