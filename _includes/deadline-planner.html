<!-- ===== Conference Deadline Planner — paste into any Jekyll/GitHub Pages markdown page ===== -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<div class="cdp" id="cdp-root" markdown="0">
<style>
  .cdp{--c-ink:#2d3142;--c-mute:#7c8193;--c-line:#e9e6f2;--c-bg:#fffdfa;--c-soft:#f7f5fc;
    --c-blue:#2f6fb3;--c-blue-bg:#e3f0fb;--c-violet:#6d5bb5;--c-violet-bg:#ece8fa;--c-green:#2e8b6a;--c-green-bg:#e1f5ec;--c-rose:#c6485f;--c-rose-bg:#fde6ea;--c-sun:#f4c95d;
    font-family:'Nunito',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--c-ink);line-height:1.5;box-sizing:border-box;max-width:100%;margin:1.5rem 0}
  .cdp *,.cdp *::before,.cdp *::after{box-sizing:inherit}
  .cdp-box{background:var(--c-bg);border:1px solid var(--c-line);border-radius:16px;padding:1.1rem 1.2rem;box-shadow:0 6px 24px -14px rgba(76,64,120,.25);margin-bottom:1rem;position:relative;overflow:hidden}
  .cdp-box::before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:linear-gradient(90deg,var(--c-blue),var(--c-violet),var(--c-green),var(--c-sun))}
  .cdp-title{display:flex;align-items:baseline;justify-content:space-between;gap:.75rem;flex-wrap:wrap;margin:.2rem 0 .9rem}
  .cdp h3{margin:0;font-size:1.35rem;font-weight:800;letter-spacing:-.01em}
  .cdp-title small,.cdp-hint{color:var(--c-mute);font-size:.8rem;font-weight:600}
  .cdp-form{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
  @media(min-width:760px){.cdp-form{grid-template-columns:2fr 1.1fr 1.1fr 1.6fr auto}}
  .cdp-form .cdp-wide{grid-column:1/-1}
  @media(min-width:760px){.cdp-form .cdp-wide{grid-column:auto}}
  .cdp input,.cdp select,.cdp button{font:inherit;font-weight:600;color:var(--c-ink);margin:0}
  .cdp input[type=text],.cdp input[type=date],.cdp select{width:100%;min-height:2.5rem;border:1.5px solid var(--c-line);border-radius:10px;padding:.45rem .7rem;background:#fff;transition:border-color .15s}
  .cdp input:focus,.cdp select:focus{outline:none;border-color:var(--c-violet);box-shadow:0 0 0 3px var(--c-violet-bg)}
  .cdp input::placeholder{color:#a9adbd;font-weight:500}
  .cdp-add{min-height:2.5rem;padding:.45rem 1.1rem;border:none;border-radius:10px;background:linear-gradient(135deg,var(--c-violet),var(--c-blue));color:#fff;font-weight:800;cursor:pointer;box-shadow:0 4px 12px -4px rgba(109,91,181,.6);transition:transform .12s,filter .15s}
  .cdp-add:hover{filter:brightness(1.07);transform:translateY(-1px)}
  .cdp-chips{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center}
  .cdp-chip{display:inline-flex;align-items:center;gap:.35rem;font-size:.78rem;font-weight:700;padding:.3rem .7rem;border-radius:999px;border:1.5px solid var(--c-line);background:#fff;color:var(--c-ink);cursor:pointer;transition:all .15s}
  .cdp-chip:hover{border-color:var(--c-violet);background:var(--c-violet-bg)}
  .cdp-chip.on{background:var(--c-violet);border-color:var(--c-violet);color:#fff}
  .cdp-chip b{font-size:.68rem;padding:0 .4rem;border-radius:999px;background:var(--c-soft);color:var(--c-mute)}
  .cdp-chip.on b{background:rgba(255,255,255,.25);color:#fff}
  .cdp-chip.zero{opacity:.6}
  .cdp-chip .x{margin-left:.1rem;opacity:.45;line-height:1}
  .cdp-chip .x:hover{opacity:1}
  .cdp-kwadd{display:inline-flex;gap:.35rem}
  .cdp-kwadd input{width:11rem;min-height:2rem !important;padding:.25rem .6rem !important;border-radius:999px !important;font-size:.78rem}
  .cdp-kwadd button{min-height:2rem;white-space:nowrap;padding:0 .8rem;border-radius:999px;border:1.5px dashed var(--c-line);background:transparent;color:var(--c-mute);font-size:.78rem;font-weight:700;cursor:pointer}
  .cdp-kwadd button:hover{border-color:var(--c-violet);color:var(--c-violet)}
  /* ---- horizontal month strip ---- */
  .cdp-strip{margin:.6rem 0 1.1rem;overflow-x:auto;padding-bottom:.25rem}
  .cdp-strip-in{min-width:640px;padding:0 3.5rem 0 2.5rem}
  .cdp-track{position:relative;height:112px}
  .cdp-rail{position:absolute;left:0;right:0;top:52px;height:6px;border-radius:3px;background:linear-gradient(90deg,var(--c-blue-bg),var(--c-violet-bg),var(--c-green-bg))}
  .cdp-today{position:absolute;top:44px;width:3px;height:22px;margin-left:-1px;background:var(--c-sun);border-radius:2px}
  .cdp-today::after{content:"";position:absolute;top:-6px;left:50%;width:9px;height:9px;margin-left:-4.5px;border-radius:50%;background:var(--c-sun)}
  .cdp-tick{position:absolute;top:66px;font-size:.68rem;font-weight:700;color:var(--c-mute);transform:translateX(-50%)}
  .cdp-tick::before{content:"";position:absolute;top:-10px;left:50%;width:1px;height:6px;background:var(--c-line)}
  .cdp-dot{position:absolute;top:47px;width:16px;height:16px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--dot);background:var(--dot);transform:translateX(-50%);cursor:pointer;transition:transform .15s}
  .cdp-dot:hover{transform:translateX(-50%) scale(1.25)}
  .cdp-dot span{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:.7rem;font-weight:800;color:var(--dot);background:#fff;padding:.05rem .4rem;border-radius:6px;border:1px solid var(--c-line)}
  .cdp-dot.alt span{bottom:auto;top:36px}
  /* ---- vertical timeline list ---- */
  .cdp-list{list-style:none;margin:0;padding:0;position:relative}
  .cdp-list::before{content:"";position:absolute;left:11px;top:8px;bottom:8px;width:2px;background:var(--c-line)}
  .cdp-item{position:relative;padding:0 0 .9rem 2rem;margin:0}
  .cdp-item.enter{animation:cdp-in .35s ease-out both}
  .cdp-item.leave{animation:cdp-out .2s ease-in both}
  @keyframes cdp-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @keyframes cdp-out{to{opacity:0;transform:translateX(8px)}}
  .cdp-item::before{content:"";position:absolute;left:5px;top:16px;width:14px;height:14px;border-radius:50%;background:var(--dot);border:3px solid #fff;box-shadow:0 0 0 2px var(--dot)}
  .cdp-card{background:#fff;border:1px solid var(--c-line);border-left:5px solid var(--dot);border-radius:12px;padding:.7rem .9rem;display:flex;flex-direction:column;gap:.4rem;transition:box-shadow .15s}
  .cdp-card:hover{box-shadow:0 8px 20px -14px rgba(76,64,120,.4)}
  .cdp-row{display:flex;justify-content:space-between;align-items:center;gap:.6rem;flex-wrap:wrap}
  .cdp-name{font-weight:800;font-size:1rem}
  .cdp-badge{display:inline-flex;align-items:center;gap:.3rem;font-size:.72rem;font-weight:800;padding:.2rem .6rem;border-radius:999px;background:var(--dot-bg);color:var(--dot);white-space:nowrap}
  .cdp-when{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;font-size:.84rem;color:var(--c-mute);font-weight:600}
  .cdp-when .d{color:var(--c-ink);font-weight:800}
  .cdp-left{font-size:.72rem;font-weight:800;padding:.1rem .5rem;border-radius:999px;background:var(--c-soft)}
  .cdp-left.soon{background:var(--c-rose-bg);color:var(--c-rose)}
  .cdp-left.past{text-decoration:line-through}
  .cdp-tags{display:flex;flex-wrap:wrap;gap:.3rem}
  .cdp-tag{font-size:.7rem;font-weight:700;padding:.1rem .5rem;border-radius:999px;background:var(--c-soft);color:var(--c-mute);cursor:pointer}
  .cdp-tag:hover,.cdp-tag.on{background:var(--c-violet-bg);color:var(--c-violet)}
  .cdp-tools{display:flex;gap:.4rem;align-items:center;margin-left:auto}
  .cdp-tools select{width:auto;min-height:1.9rem;padding:.15rem .5rem;font-size:.75rem;border-radius:8px}
  .cdp-rm{border:none;background:transparent;color:var(--c-mute);font-size:.75rem;font-weight:700;cursor:pointer;padding:.2rem .4rem;border-radius:6px}
  .cdp-rm:hover{background:var(--c-rose-bg);color:var(--c-rose)}
  .cdp-empty{color:var(--c-mute);font-weight:600;font-size:.9rem;padding:.5rem 0 .5rem 2rem}
  .cdp-foot{display:flex;justify-content:space-between;gap:.5rem;flex-wrap:wrap;font-size:.76rem;font-weight:600;color:var(--c-mute);margin-top:.4rem}
  .cdp-foot button{border:none;background:none;color:var(--c-mute);font-size:.76rem;font-weight:700;cursor:pointer;padding:0}
  .cdp-foot button:hover{color:var(--c-rose)}
  .cdp-legend{display:flex;gap:.7rem;flex-wrap:wrap}
  .cdp-legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--dot);margin-right:.3rem}
</style>

<div class="cdp-box">
  <div class="cdp-title">
    <h3>Conference Deadline Planner</h3>
    <small>Saved in this browser · click a keyword to filter</small>
  </div>

  <form class="cdp-form" id="cdp-form" autocomplete="off">
    <input type="text" id="cdp-name" class="cdp-wide" placeholder="Conference, e.g. DAC 2027" required maxlength="80">
    <input type="date" id="cdp-date" aria-label="Deadline">
    <select id="cdp-status" aria-label="Status">
      <option value="progress">⏳ In Progress</option>
      <option value="planned" selected>🪵 Planned</option>
      <option value="submitted">✅ Submitted</option>
      <option value="urgent">🚨 Urgent</option>
    </select>
    <input type="text" id="cdp-kw" class="cdp-wide" placeholder="Keywords, comma-separated" list="cdp-kwlist">
    <datalist id="cdp-kwlist"></datalist>
    <button type="submit" class="cdp-add cdp-wide">Add</button>
  </form>

  <div class="cdp-strip" id="cdp-strip"></div>

  <div class="cdp-chips" id="cdp-chips"></div>
</div>

<div class="cdp-box">
  <ul class="cdp-list" id="cdp-list"></ul>
  <div class="cdp-empty" id="cdp-empty" hidden>Nothing matches this filter.</div>
  <div class="cdp-foot">
    <div class="cdp-legend">
      <span style="--dot:var(--c-blue)">In Progress</span><span style="--dot:var(--c-violet)">Planned</span>
      <span style="--dot:var(--c-green)">Submitted</span><span style="--dot:var(--c-rose)">Urgent</span>
    </div>
    <button type="button" id="cdp-reset">Reset to defaults</button>
  </div>
</div>
</div>

<script>
(function () {
  'use strict';
  var root = document.getElementById('cdp-root');
  if (!root || root.dataset.init) return;
  root.dataset.init = '1';

  var KEY = 'cdp:planner:v2', WKEY = 'cdp:watch:v2';
  var S = {
    progress:  { label: 'In Progress', icon: '⏳', c: 'var(--c-blue)',   bg: 'var(--c-blue-bg)' },
    planned:   { label: 'Planned',     icon: '🪵', c: 'var(--c-violet)', bg: 'var(--c-violet-bg)' },
    submitted: { label: 'Submitted',   icon: '✅', c: 'var(--c-green)',  bg: 'var(--c-green-bg)' },
    urgent:    { label: 'Urgent',      icon: '🚨', c: 'var(--c-rose)',   bg: 'var(--c-rose-bg)' }
  };
  var DEFAULTS = [
    { id: 'd1', name: 'IEEE ISCAS 2027', date: '2026-10-22', status: 'progress', kw: ['threshold logic', 'FPGA', 'circuits & systems'] },
    { id: 'd2', name: 'ISSCC 2027', date: '', status: 'progress', kw: ['SoC', 'BNN inference', 'SKY130'] },
    { id: 'd3', name: 'IEEE SOCC 2026 · TINKER', date: '', status: 'submitted', kw: ['SoC', 'BNN inference', 'SKY130', 'threshold logic'] },
    { id: 'd4', name: 'ACM GLSVLSI 2026 · TLG2LUT6', date: '', status: 'submitted', kw: ['threshold logic', 'FPGA', 'LUT6 mapping'] },
    { id: 'd5', name: 'IEEE TVLSI · TLG2LUT6 extension', date: '', status: 'submitted', kw: ['threshold logic', 'FPGA', 'LUT6 mapping'] },
    { id: 'd6', name: 'ACM JETC · TLGLock-FPGA', date: '', status: 'submitted', kw: ['logic locking', 'hardware security', 'FPGA'] },
    { id: 'd7', name: 'DAC 2027', date: '', status: 'planned', kw: ['AI hardware primitives', 'ternary LLM', 'FPGA'] },
    { id: 'd8', name: 'ISQED 2027', date: '', status: 'planned', kw: ['quantization-aware training', 'threshold logic', 'LUT6 mapping'] }
  ];
  var DEFAULT_WATCH = ['threshold logic', 'FPGA', 'logic locking', 'hardware security', 'LUT6 mapping',
    'hyperdimensional computing', 'ML-driven EDA', 'cryogenic circuits', 'BNN inference', 'quantization-aware training', 'AI hardware primitives', 'SoC'];

  function load(k) { try { var v = JSON.parse(localStorage.getItem(k)); return Array.isArray(v) ? v : null; } catch (e) { return null; } }
  function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  function clone(a) { return JSON.parse(JSON.stringify(a)); }
  var items = load(KEY) || clone(DEFAULTS), watch = load(WKEY) || clone(DEFAULT_WATCH);
  save(KEY, items); save(WKEY, watch);

  var M = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  function iso(s) { if (!/^\d{4}-\d{2}-\d{2}$/.test(s || '')) return null; var p = s.split('-'); return new Date(+p[0], p[1] - 1, +p[2]); }
  function fmt(s) { var d = iso(s); return d ? M[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear() : 'Date TBD'; }
  function days(s) { var d = iso(s); if (!d) return null; var t = new Date(); t.setHours(0,0,0,0); return Math.round((d - t) / 864e5); }
  function nk(s) { return s.trim().replace(/\s+/g, ' '); }
  function lk(s) { return nk(s).toLowerCase(); }
  function kws(s) { var seen = {}, o = []; (s || '').split(',').forEach(function (k) { k = nk(k); if (k && !seen[lk(k)]) { seen[lk(k)] = 1; o.push(k); } }); return o; }
  function watched(k) { return watch.some(function (w) { return lk(w) === lk(k); }); }
  function el(t, c, txt) { var e = document.createElement(t); if (c) e.className = c; if (txt != null) e.textContent = txt; return e; }
  function $(id) { return document.getElementById(id); }
  function uid() { return 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

  var form = $('cdp-form'), nameIn = $('cdp-name'), dateIn = $('cdp-date'), statusIn = $('cdp-status'), kwIn = $('cdp-kw'), kwList = $('cdp-kwlist'),
      list = $('cdp-list'), empty = $('cdp-empty'), strip = $('cdp-strip'), chips = $('cdp-chips');
  var active = null;

  function sortFn(a, b) { var da = iso(a.date), db = iso(b.date); if (da && db) return da - db; if (da) return -1; if (db) return 1; return a.name.localeCompare(b.name); }
  function counts() { var c = {}; items.forEach(function (it) { it.kw.forEach(function (k) { c[lk(k)] = (c[lk(k)] || 0) + 1; }); }); return c; }
  function filt(it) { return !active || it.kw.some(function (k) { return lk(k) === active; }); }
  function toggle(k) { active = active === lk(k) ? null : lk(k); render(); }

  /* month strip: today → +12 months */
  function renderStrip() {
    strip.innerHTML = '';
    var now = new Date(); now.setHours(0,0,0,0);
    var start = new Date(now.getFullYear(), now.getMonth(), 1);
    var end = new Date(now.getFullYear(), now.getMonth() + 13, 1);
    var span = end - start;
    var pct = function (d) { return Math.max(0, Math.min(100, (d - start) / span * 100)); };
    var outer = el('div', 'cdp-strip-in'), inner = el('div', 'cdp-track');
    outer.appendChild(inner);
    inner.appendChild(el('div', 'cdp-rail'));
    for (var i = 0; i <= 12; i++) {
      var m = new Date(start.getFullYear(), start.getMonth() + i, 1);
      var t = el('div', 'cdp-tick', M[m.getMonth()] + (m.getMonth() === 0 || i === 0 ? ' ’' + String(m.getFullYear()).slice(2) : ''));
      t.style.left = pct(m) + '%'; inner.appendChild(t);
    }
    var today = el('div', 'cdp-today'); today.style.left = pct(now) + '%'; today.title = 'Today · ' + fmt(now.toISOString().slice(0, 10)); inner.appendChild(today);
    var n = 0;
    items.slice().sort(sortFn).forEach(function (it) {
      var d = iso(it.date); if (!d || d < start || d >= end || !filt(it)) return;
      var dot = el('div', 'cdp-dot' + (n++ % 2 ? ' alt' : ''));
      dot.style.left = pct(d) + '%'; dot.style.setProperty('--dot', S[it.status].c);
      dot.title = it.name + ' · ' + fmt(it.date);
      dot.appendChild(el('span', null, it.name.split(' · ')[0]));
      dot.addEventListener('click', function () { var c = list.querySelector('[data-id="' + it.id + '"]'); if (c) c.scrollIntoView({ behavior: 'smooth', block: 'center' }); });
      inner.appendChild(dot);
    });
    strip.appendChild(outer);
  }

  function renderChips() {
    chips.innerHTML = '';
    var c = counts();
    watch.forEach(function (w) {
      var ch = el('span', 'cdp-chip' + (active === lk(w) ? ' on' : '') + (c[lk(w)] ? '' : ' zero'));
      ch.appendChild(el('span', null, w));
      ch.appendChild(el('b', null, String(c[lk(w)] || 0)));
      var x = el('span', 'x', '×'); x.title = 'Stop tracking';
      x.addEventListener('click', function (e) { e.stopPropagation(); watch = watch.filter(function (k) { return lk(k) !== lk(w); }); if (active === lk(w)) active = null; save(WKEY, watch); render(); });
      ch.appendChild(x);
      ch.addEventListener('click', function () { toggle(w); });
      chips.appendChild(ch);
    });
    var f = el('form', 'cdp-kwadd');
    var inp = el('input'); inp.type = 'text'; inp.placeholder = 'Track a keyword…'; inp.maxLength = 40;
    var b = el('button', null, '+ Track'); b.type = 'submit';
    f.appendChild(inp); f.appendChild(b);
    f.addEventListener('submit', function (e) { e.preventDefault(); var k = nk(inp.value); if (k && !watched(k)) { watch.push(k); save(WKEY, watch); render(); } });
    chips.appendChild(f);
    kwList.innerHTML = '';
    watch.forEach(function (k) { var o = el('option'); o.value = k; kwList.appendChild(o); });
  }

  function card(it, anim) {
    var li = el('li', 'cdp-item' + (anim ? ' enter' : '')); li.setAttribute('data-id', it.id);
    li.style.setProperty('--dot', S[it.status].c); li.style.setProperty('--dot-bg', S[it.status].bg);
    var c = el('div', 'cdp-card');
    var r1 = el('div', 'cdp-row'); r1.appendChild(el('div', 'cdp-name', it.name));
    r1.appendChild(el('span', 'cdp-badge', S[it.status].icon + ' ' + S[it.status].label)); c.appendChild(r1);
    var w = el('div', 'cdp-when'); w.appendChild(el('span', 'd', fmt(it.date)));
    var n = days(it.date);
    if (n !== null) {
      var L = el('span', 'cdp-left');
      if (n < 0) { L.textContent = Math.abs(n) + 'd ago'; L.classList.add('past'); }
      else if (n === 0) { L.textContent = 'due today'; L.classList.add('soon'); }
      else { L.textContent = n + (n === 1 ? ' day left' : ' days left'); if (n <= 14 && it.status !== 'submitted') L.classList.add('soon'); }
      w.appendChild(L);
    }
    c.appendChild(w);
    var r2 = el('div', 'cdp-row');
    var tags = el('div', 'cdp-tags');
    it.kw.forEach(function (k) {
      var t = el('span', 'cdp-tag' + (active === lk(k) ? ' on' : ''), k);
      t.addEventListener('click', function () { toggle(k); }); tags.appendChild(t);
    });
    r2.appendChild(tags);
    var tools = el('div', 'cdp-tools');
    var sel = el('select'); sel.setAttribute('aria-label', 'Change status');
    Object.keys(S).forEach(function (k) { var o = el('option', null, S[k].icon + ' ' + S[k].label); o.value = k; o.selected = k === it.status; sel.appendChild(o); });
    sel.addEventListener('change', function () { it.status = sel.value; save(KEY, items); render(); });
    var rm = el('button', 'cdp-rm', 'Remove'); rm.type = 'button';
    rm.addEventListener('click', function () { li.classList.add('leave'); setTimeout(function () { items = items.filter(function (x) { return x.id !== it.id; }); save(KEY, items); render(); }, 180); });
    tools.appendChild(sel); tools.appendChild(rm); r2.appendChild(tools);
    c.appendChild(r2); li.appendChild(c);
    return li;
  }

  function render(newId) {
    list.innerHTML = '';
    var vis = items.slice().sort(sortFn).filter(filt);
    vis.forEach(function (it) { list.appendChild(card(it, it.id === newId)); });
    empty.hidden = vis.length > 0;
    renderStrip(); renderChips();
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var name = nameIn.value.trim(); if (!name) { nameIn.focus(); return; }
    var it = { id: uid(), name: name, date: dateIn.value || '', status: statusIn.value, kw: kws(kwIn.value) };
    items.push(it); save(KEY, items);
    form.reset(); statusIn.value = 'planned'; active = null;
    render(it.id); nameIn.focus();
  });
  $('cdp-reset').addEventListener('click', function () {
    if (!confirm('Reset to the built-in defaults? Your custom entries will be removed.')) return;
    items = clone(DEFAULTS); watch = clone(DEFAULT_WATCH); save(KEY, items); save(WKEY, watch); active = null; render();
  });
  render();
})();
</script>
<!-- ===== /Conference Deadline Planner ===== -->
