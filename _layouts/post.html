---
layout: default
---
<div class="container">
  <header class="post-head">
    <div class="eyebrow">Blog</div>
    <h1>{{ page.title }}</h1>
    {% if page.subtitle %}<p class="sub muted">{{ page.subtitle }}</p>{% endif %}
    <div class="meta"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: site.date_format }}</time>{% if page.author %} · {{ page.author }}{% endif %}</div>
  </header>
  <article class="prose">
    {{ content }}
    {% if page.tags.size > 0 %}
    <div class="post-tags">{% for tag in page.tags %}<a class="chip" href="{{ '/tags' | relative_url }}#{{ tag }}">#{{ tag }}</a>{% endfor %}</div>
    {% endif %}
  </article>
</div>
