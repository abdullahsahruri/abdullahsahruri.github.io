---
layout: default
---

<div class="container">
    {% if page.title %}
    <div class="page-header">
        <h1 class="page-title">{{ page.title }}</h1>
        {% if page.subtitle %}
        <p class="page-subtitle">{{ page.subtitle }}</p>
        {% endif %}
    </div>
    {% endif %}

    <article class="page-content">
        {{ content }}
    </article>
</div>
