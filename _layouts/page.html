---
layout: default
---
<div class="container">
  {% if page.title %}
  <header class="page-head">
    {% if page.eyebrow %}<div class="eyebrow">{{ page.eyebrow }}</div>{% endif %}
    <h1>{{ page.title }}</h1>
    {% if page.subtitle %}<p class="sub">{{ page.subtitle }}</p>{% endif %}
    {% if page.cv %}<div class="actions"><a class="btn btn-primary" href="{{ page.cv | relative_url }}" download><i class="fas fa-file-arrow-down"></i> Download CV (PDF)</a></div>{% endif %}
  </header>
  {% endif %}
  <article class="{% if page.prose != false %}prose{% endif %}">
    {{ content }}
  </article>
</div>
