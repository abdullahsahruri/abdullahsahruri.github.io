name: Add or update a conference

on:
  workflow_dispatch:
    inputs:
      name:
        description: "Conference name with year, e.g. FCCM 2027"
        required: true
      url:
        description: "Home page URL"
        required: false
      deadline:
        description: "Paper deadline, YYYY-MM-DD (leave empty for TBD)"
        required: false
      date:
        description: "Conference start date, YYYY-MM-DD (leave empty for TBD)"
        required: false
      note:
        description: "Short note, e.g. 'abstract 2027-01-05'"
        required: false
      pin:
        description: "Protect this entry from the automatic updater"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Apply
        env:
          C_NAME: ${{ inputs.name }}
          C_URL: ${{ inputs.url }}
          C_DEADLINE: ${{ inputs.deadline }}
          C_DATE: ${{ inputs.date }}
          C_NOTE: ${{ inputs.note }}
          C_PIN: ${{ inputs.pin }}
        run: |
          args=(--name "$C_NAME" --url "$C_URL" --deadline "$C_DEADLINE" --date "$C_DATE" --note "$C_NOTE")
          [ "$C_PIN" = "true" ] && args+=(--pin)
          python scripts/add_conference.py "${args[@]}" | tee add.log
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/conferences.yml
          git diff --cached --quiet && { echo "No change."; exit 0; }
          git commit -m "Conferences: $(cat add.log)"
          git push
