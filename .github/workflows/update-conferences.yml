name: Update conference list

on:
  workflow_dispatch:   # manual only; the keyword-search job (discover-conferences.yml) is the scheduled one

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Merge Chalmers list into _data/conferences.yml
        run: python scripts/update_conferences.py | tee update.log
      - name: Commit if anything changed
        run: |
          if git diff --quiet -- _data/conferences.yml; then
            echo "Nothing to commit."; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/conferences.yml
          { echo "Update conference list"; echo; cat update.log; } | git commit -F -
          git push
